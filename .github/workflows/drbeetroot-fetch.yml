name: Dr Beetroot test - fetch media

on:
  push:
    branches: [dr-beetroot-test]
    paths: ["drbeetroot/*.txt", ".github/workflows/drbeetroot-fetch.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch stock clips
        run: |
          mkdir -p drbeetroot/out
          while read -r name base; do
            [ -z "$name" ] && continue
            ok=""
            for q in large medium small tiny; do
              if curl -sfL -m 120 -A "Mozilla/5.0" -o raw.mp4 "${base}_${q}.mp4"; then ok=$q; break; fi
            done
            if [ -z "$ok" ]; then echo "::warning::no download for $name"; continue; fi
            ffmpeg -y -loglevel error -ss 1 -t 7 -i raw.mp4 -an \
              -vf "crop=ih*9/16:ih,scale=1080:1920:flags=lanczos,fps=30" \
              -c:v libx264 -crf 24 -preset medium -pix_fmt yuv420p "drbeetroot/out/${name}.mp4" \
              && echo "::notice::$name ok ($ok)" || echo "::warning::encode failed for $name"
          done < drbeetroot/videos.txt
      - name: Fetch illustrations
        run: |
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          i=0
          while IFS='|' read -r name subject bg; do
            [ -z "$name" ] && continue
            i=$((i+1))
            p="$subject, adorable 3D clay render, soft rounded shapes, glossy, pastel colors, soft studio lighting, centered single subject, plain solid $bg background, no text, no letters"
            for try in 1 2 3; do
              if curl -sfL -m 180 -o "drbeetroot/out/${name}.jpg" "https://image.pollinations.ai/prompt/$(enc "$p")?width=1024&height=1024&model=flux&nologo=true&seed=$((40+i))" \
                 && file "drbeetroot/out/${name}.jpg" | grep -qi image; then echo "::notice::$name image ok"; break; fi
              rm -f "drbeetroot/out/${name}.jpg"; echo "::warning::$name image try $try failed"; sleep 15
            done
            sleep 6
          done < drbeetroot/images.txt
      - name: Commit results
        run: |
          ls -la drbeetroot/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drbeetroot/out
          git commit -m "Dr Beetroot test media" || echo "nothing to commit"
          git push
