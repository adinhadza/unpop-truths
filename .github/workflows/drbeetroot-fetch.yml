name: Dr Beetroot test - fetch media

on:
  push:
    branches: [dr-beetroot-test]
    paths: ["drbeetroot/*.txt", ".github/workflows/drbeetroot-fetch.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch stock clips
        run: |
          mkdir -p drbeetroot/out
          while read -r name base; do
            [ -z "$name" ] && continue
            ok=""
            for q in large medium small tiny; do
              if curl -sfL -m 120 -A "Mozilla/5.0" -o raw.mp4 "${base}_${q}.mp4" < /dev/null; then ok=$q; break; fi
            done
            if [ -z "$ok" ]; then echo "::warning::no download for $name"; continue; fi
            ffmpeg -nostdin -y -loglevel error -ss 1 -t 7 -i raw.mp4 -an \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,fps=30" \
              -c:v libx264 -crf 24 -preset medium -pix_fmt yuv420p "drbeetroot/out/${name}.mp4" \
              && echo "::notice::$name ok ($ok)" || echo "::warning::encode failed for $name"
          done < drbeetroot/videos.txt
      - name: Commit results
        run: |
          ls -la drbeetroot/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drbeetroot/out
          git commit -m "Dr Beetroot test media" || echo "nothing to commit"
          git push
