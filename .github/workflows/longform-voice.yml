name: Long-form - make narration
run-name: "Voice ${{ inputs.voice }} ${{ inputs.out }}"

on:
  workflow_dispatch:
    inputs:
      scenes: {description: "Scenes file, e.g. longform/ep01/scenes.json", required: true, type: string}
      out: {description: "Folder on branch longform-assets, e.g. ep01/voice", required: true, type: string}
      voice: {description: "Kokoro voice, e.g. am_michael, am_fenrir, bm_george", required: true, type: string, default: am_michael}
      speed: {description: "Speed (1.0 normal)", required: false, type: string, default: "1.0"}
      only: {description: "Only these scene ids (comma list). Empty = all", required: false, type: string, default: ""}
      joined: {description: "Also save one joined sample file with this name (e.g. sample-am_michael.wav)", required: false, type: string, default: ""}

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Speak
        run: |
          J=""; [ -n "${{ inputs.joined }}" ] && J="--joined out/${{ inputs.joined }}"
          python3 scripts/longform_voice.py "${{ inputs.scenes }}" out --voice "${{ inputs.voice }}" --speed "${{ inputs.speed }}" --only "${{ inputs.only }}" $J
          for f in out/*.wav; do ffmpeg -v error -y -i "$f" -c:a aac -b:a 160k "${f%.wav}.m4a" && rm "$f"; done
          echo "::notice::made $(ls out | wc -l) files"
      - name: Save to branch longform-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir assets && cd assets && git init -q
          git config user.name "longform-bot"; git config user.email "longform-bot@users.noreply.github.com"
          git remote add store "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 store longform-assets && git checkout -q -b longform-assets FETCH_HEAD
          mkdir -p "${{ inputs.out }}" && cp ../out/* "${{ inputs.out }}/"
          git add -A && (git commit -q -m "voice ${{ inputs.out }}" || exit 0)
          git push -q store HEAD:longform-assets
