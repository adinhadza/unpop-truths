name: Post Reel to Facebook Page

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public link to the finished MP4 (for example a Canva export link)"
        required: true
        type: string
      caption:
        description: "Caption for the Reel"
        required: false
        type: string
        default: ""
      mode:
        description: "hosted = Facebook fetches the link itself; upload = download here, then upload the file"
        required: false
        type: choice
        default: auto
        options: [auto, hosted, upload]
      music:
        description: "auto = any track; none = no music; or the name of a mood folder (for example calm) or a single file inside the music folder"
        required: false
        type: string
        default: auto
      music_volume:
        description: "Music loudness, 0 to 1"
        required: false
        type: string
        default: "0.35"
      dry_run:
        description: "Prepare the video but do not post it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VIDEO_URL: ${{ inputs.video_url }}
          CAPTION: ${{ inputs.caption }}
          MODE: ${{ inputs.mode }}
          MUSIC: ${{ inputs.music }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/post_reel.sh
