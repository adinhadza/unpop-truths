name: Post Reel to Facebook Page
run-name: "Post Reel ${{ inputs.post_key }}"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public link to the finished MP4 (for example a Canva export link)"
        required: true
        type: string
      caption:
        description: "Caption for the Reel"
        required: false
        type: string
        default: ""
      mode:
        description: "hosted = Facebook fetches the link itself; upload = download here, then upload the file"
        required: false
        type: choice
        default: auto
        options: [auto, hosted, upload]
      music:
        description: "auto = any track; none = no music; or the name of a mood folder (for example calm) or a single file inside the music folder"
        required: false
        type: string
        default: auto
      music_level:
        description: "Music loudness as an average level in dB. -27 is soft background; -22 is noticeably louder"
        required: false
        type: string
        default: "-27"
      publish_at:
        description: "When to publish, for example 2026-10-08T01:00:00+02:00. Leave empty to publish now"
        required: false
        type: string
        default: ""
      post_key:
        description: "Optional id of the guide post, for example 2026-10-09-s04 (shown in the run name so posts are not queued twice)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Prepare the video but do not post it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: post-reel-${{ inputs.post_key || github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Make sure ffmpeg is available
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "::notice::ffmpeg already installed"
          else
            mkdir -p "$HOME/ffmpeg"
            curl -sSL --fail --connect-timeout 20 --max-time 150 \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ --strip-components=2 -C "$HOME/ffmpeg" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            echo "::notice::ffmpeg downloaded: $("$HOME/ffmpeg/ffmpeg" -version | head -1 | cut -d' ' -f1-3)"
          fi
      - name: Publish Reel
        timeout-minutes: 8
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SYSTEM_TOKEN: ${{ secrets.FB_SYSTEM_TOKEN }}
          VIDEO_URL: ${{ inputs.video_url }}
          CAPTION: ${{ inputs.caption }}
          MODE: ${{ inputs.mode }}
          MUSIC: ${{ inputs.music }}
          MUSIC_LEVEL: ${{ inputs.music_level }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/post_reel.sh
