name: Long-form - make scene pictures
run-name: "Pictures ${{ inputs.scenes }} ${{ inputs.only }}"

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes file in the repo, e.g. longform/ep01/scenes.json"
        required: true
        type: string
      out:
        description: "Folder on branch longform-assets, e.g. ep01/img"
        required: true
        type: string
      only:
        description: "Only these scene ids (comma list). Empty = all"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: longform-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Make pictures
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/longform_images.py "${{ inputs.scenes }}" out --only "${{ inputs.only }}" 2>&1 | tee img.log; grep -E "failed|ok via" img.log | tail -5 | sed "s/^/::notice::/"; test ${PIPESTATUS[0]} -eq 0
      - name: Save to branch longform-assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ inputs.out }}
          REPO: ${{ github.repository }}
        run: |
          echo "::notice::files: $(ls out | tr '\n' ' ')"
          ls out/*.jpg >/dev/null 2>&1 || { echo "::error::no pictures were made"; exit 1; }
          bad=0
          for f in out/*.jpg; do
            path="$OUT/$(basename "$f")"
            sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/$path?ref=longform-assets" | jq -r '.sha // empty')
            base64 -w0 "$f" > b64.txt
            jq -n --arg m "pictures $path" --rawfile c b64.txt --arg s "$sha" \
              '{message:$m, content:$c, branch:"longform-assets"} + (if $s=="" then {} else {sha:$s} end)' > body.json
            code=$(curl -s -o resp.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/contents/$path" --data @body.json)
            if [ "$code" = 200 ] || [ "$code" = 201 ]; then echo "::notice::saved $path"; else bad=1; echo "::error::$path HTTP $code $(jq -r .message resp.json)"; fi
          done
          exit $bad
