name: Long-form - make scene pictures
run-name: "Pictures ${{ inputs.scenes }} ${{ inputs.only }}"

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes file in the repo, e.g. longform/ep01/scenes.json"
        required: true
        type: string
      out:
        description: "Folder on branch longform-assets, e.g. ep01/img"
        required: true
        type: string
      only:
        description: "Only these scene ids (comma list). Empty = all"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: longform-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Make pictures
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/longform_images.py "${{ inputs.scenes }}" out --only "${{ inputs.only }}"
      - name: Save to branch longform-assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la out
          mkdir assets && cd assets
          git init -q
          git config user.name "longform-bot"; git config user.email "longform-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin longform-assets
          git checkout -q -b longform-assets FETCH_HEAD
          mkdir -p "${{ inputs.out }}"
          cp ../out/*.jpg "${{ inputs.out }}/" 2>/dev/null || true
          git add -A
          git commit -q -m "pictures ${{ inputs.out }}" || { echo "nothing new"; exit 0; }
          git push -q origin longform-assets
