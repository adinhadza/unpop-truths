name: Long-form - narration from voice.txt
run-name: "Narration ${{ github.sha }}"

# Pushing longform/epNN/voice.txt ("voice speed") makes the whole episode's narration
# and saves it to branch longform-assets at epNN/voice-<voice>/ (old voices are kept).
on:
  push:
    branches: [main]
    paths: ["longform/*/voice.txt"]

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Speak changed episodes
        run: |
          mkdir -p out
          for vt in $(git diff --name-only HEAD~1 HEAD -- 'longform/*/voice.txt'); do
            ep=$(basename "$(dirname "$vt")"); read -r v sp < "$vt"
            python3 scripts/longform_voice.py "longform/$ep/scenes.json" "out/$ep/voice-$v" --voice "$v" --speed "${sp:-1.0}"
          done
          find out -name '*.wav' | while read -r f; do ffmpeg -nostdin -v error -y -i "$f" -c:a aac -b:a 160k "${f%.wav}.m4a" && rm "$f"; done
          echo "::notice::made $(find out -type f | wc -l) files"
      - name: Save to branch longform-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          bad=0
          cd out
          for f in $(find . -type f | sed 's#^\./##' | sort); do
            path="$f"
            sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/$path?ref=longform-assets" | jq -r '.sha // empty')
            base64 -w0 "$f" > /tmp/b64.txt
            jq -n --arg m "voice $path" --rawfile c /tmp/b64.txt --arg s "$sha" \
              '{message:$m, content:$c, branch:"longform-assets"} + (if $s=="" then {} else {sha:$s} end)' > /tmp/body.json
            for try in 1 2 3; do
              code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/contents/$path" --data @/tmp/body.json)
              [ "$code" = 200 ] || [ "$code" = 201 ] && break; sleep $((try*3))
            done
            if [ "$code" = 200 ] || [ "$code" = 201 ]; then echo "saved $path"; else bad=1; echo "::error::$path HTTP $code"; fi
          done
          exit $bad
